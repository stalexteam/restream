<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>restream-controller</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div id="toast-container"></div>

<header>
  <nav id="tab-nav" class="tabs">
    <button type="button" class="tab-button active" data-tab="status">Status</button>
    <button type="button" class="tab-button" data-tab="settings">Settings</button>
  </nav>
  <div class="indicators">
    <div id="ws-indicator" class="indicator ind-connecting" title="Connecting…">WS</div>
    <div id="broadcast-indicator" class="indicator bstate-offline">Offline</div>
  </div>
</header>

<section id="tab-status" class="tab-panel">
  <div id="components">
    <h2>Components</h2>
    <table id="components-table">
      <thead>
        <tr><th>Component</th><th>Status</th><th>PID</th><th>CPU</th><th>Mem</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<section id="tab-settings" class="tab-panel" hidden>
  <form id="settings-form">
    <div class="field">
      <label for="field-twitch-url">Twitch RTMP URL (includes your stream key)</label>
      <div class="masked-field">
        <input type="password" id="field-twitch-url" name="twitch_url" autocomplete="off" spellcheck="false">
        <button type="button" id="toggle-twitch-url" class="reveal-toggle">Show</button>
      </div>
    </div>

    <div class="field">
      <label for="field-backup">Backup video path (on the VPS)</label>
      <input type="text" id="field-backup" name="backup_file" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="field-connect-timeout">Connect timeout (ms) -- wait for OBS's first frame</label>
      <input type="number" id="field-connect-timeout" name="connect_timeout_ms" min="2500" step="1">
    </div>

    <div class="field">
      <label for="field-read-timeout">Read timeout (ms) -- react to a stalled network once live</label>
      <input type="number" id="field-read-timeout" name="read_timeout_ms" min="300" step="1">
    </div>

    <div class="field">
      <label for="field-offline-timeout">Offline timeout (seconds)</label>
      <input type="number" id="field-offline-timeout" name="offline_timeout_sec" min="60" step="1">
    </div>

    <div id="settings-errors" class="errors" hidden></div>

    <div class="actions">
      <button type="button" id="btn-apply">Apply</button>
      <button type="button" id="btn-apply-restart" class="primary">Apply &amp; Restart</button>
    </div>
  </form>
</section>

<script src="dashboard.js"></script>
</body>
</html>
